name: Web game checks
on:
  push:
    paths: ['apps/web/**', 'src/data/**', 'spacetime/**', '.github/workflows/web-checks.yml']
  pull_request:
    paths: ['apps/web/**', 'src/data/**', 'spacetime/**', '.github/workflows/web-checks.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix ../../spacetime
      - run: npm run typecheck --prefix ../../spacetime
